[project]
name = "bosch-xai"
version = "0.1.0"
description = "Explainable failure prediction on the Bosch Production Line Performance data"
readme = "README.md"
authors = [
    { name = "Anton P. Stahl", email = "anton.pstahl@icloud.com" }
]
requires-python = ">=3.12"
dependencies = [
    "kagglehub>=1.0.3",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "polars>=2.1.0",
    "scikit-learn>=1.9.1",
]

[project.scripts]
bosch-xai = "bosch_xai.cli:main"

[project.optional-dependencies]
llm = [
    "anthropic>=2.9.0",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
